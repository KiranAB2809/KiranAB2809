<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  html { background: #0a0715; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0a0715 0%, #1a1030 55%, #0a0715 100%);
    position: absolute;
    inset: 0;
    color: #fff;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .b1 { width: 480px; height: 480px; top: -140px; left: -120px; background: #7c3aed; }
  .b2 { width: 420px; height: 420px; bottom: -160px; right: -100px; background: #ec4899; }
  .b3 { width: 320px; height: 320px; bottom: 40px; left: 380px; background: #06b6d4; opacity: .35; }

  .wrap { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; width: 100%; height: 100%; padding: 80px 90px; }
  .left { max-width: 660px; }
  .eyebrow { font-family: "Cascadia Code", "Consolas", monospace; font-size: 20px; color: #ec4899; letter-spacing: .05em; margin-bottom: 22px; }
  .name { font-size: 64px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .role { font-family: "Cascadia Code", "Consolas", monospace; font-size: 26px; color: #cbc4e6; margin-top: 18px; }
  .tagline { font-size: 20px; color: #a99fd1; margin-top: 22px; line-height: 1.5; max-width: 560px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .chip {
    font-family: "Cascadia Code", "Consolas", monospace; font-size: 15px;
    padding: 8px 16px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #e8e3fa;
  }
  .portrait {
    width: 300px; height: 375px; border-radius: 28px; overflow: hidden;
    border: 2px solid rgba(255,255,255,.15); flex-shrink: 0;
    box-shadow: 0 30px 80px -20px rgba(124,58,237,.5);
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .monogram {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(120deg, #7c3aed, #ec4899 45%, #06b6d4 75%, #f59e0b);
    font-size: 110px; font-weight: 800; color: #fff;
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="wrap">
    <div class="left">
      <div class="eyebrow" id="ogEyebrow">PORTFOLIO</div>
      <div class="name" id="ogName">Loading…</div>
      <div class="role" id="ogRole"></div>
      <div class="tagline" id="ogTagline"></div>
      <div class="chips" id="ogChips"></div>
    </div>
    <div class="portrait" id="ogPortrait"><img id="ogAvatarImg" src="" alt=""></div>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    fetch('../data/profile.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var p = data.profile;
        document.getElementById('ogName').textContent = p.name;
        document.getElementById('ogRole').textContent = p.role;
        document.getElementById('ogTagline').textContent = p.tagline;

        var chipsWrap = document.getElementById('ogChips');
        (data.skillTags || []).slice(0, 6).forEach(function (t) {
          var c = document.createElement('div');
          c.className = 'chip';
          c.textContent = t;
          chipsWrap.appendChild(c);
        });

        var img = document.getElementById('ogAvatarImg');
        var portrait = document.getElementById('ogPortrait');
        img.onerror = function () {
          portrait.innerHTML = '<div class="monogram">' + escapeHtml(p.initials || '') + '</div>';
        };
        img.src = '../' + p.avatar;

        window.__OG_READY__ = true;
      })
      .catch(function () {
        document.getElementById('ogName').textContent = 'Portfolio';
        window.__OG_READY__ = true;
      });
  </script>
</body>
</html>
