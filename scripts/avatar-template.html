<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="out" width="800" height="1000"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
<script>
  // ---- Named tuning constants (see README "Swapping in your photo") ----
  var CROP = { x: 0, y: 0, w: 1, h: 1 };   // fraction-of-source crop box, 4:5 target ratio
  var FEATHER = 2;                          // px blur on the cutout mask edge
  var TINT = 0.10;                          // brand-color soft-light tint strength (0-1)
  var RIM = 0.18;                           // rim-light opacity (keep <= 0.20)
  var SETTLE = 0.12;                        // ambient occlusion / shadow strength behind subject
  var MUTE = 0.35;                          // desaturation strength below the collar

  var OUT_W = 800, OUT_H = 1000;

  function paintBackdrop(ctx) {
    var grad = ctx.createLinearGradient(0, 0, OUT_W, OUT_H);
    grad.addColorStop(0, '#3a1f78');
    grad.addColorStop(0.45, '#8b2f7a');
    grad.addColorStop(0.75, '#1f7a8c');
    grad.addColorStop(1, '#c98a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, OUT_W, OUT_H);

    var key = ctx.createRadialGradient(OUT_W * 0.5, OUT_H * 0.32, 20, OUT_W * 0.5, OUT_H * 0.32, OUT_H * 0.5);
    key.addColorStop(0, 'rgba(255,255,255,0.28)');
    key.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = key;
    ctx.fillRect(0, 0, OUT_W, OUT_H);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, OUT_W, OUT_H);
    var vignette = ctx.createRadialGradient(OUT_W / 2, OUT_H / 2, OUT_H * 0.3, OUT_W / 2, OUT_H / 2, OUT_H * 0.75);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, OUT_W, OUT_H);
  }

  function finish(canvas) {
    window.__AVATAR_READY__ = true;
    window.__AVATAR_CANVAS_ID__ = 'out';
  }

  function runFallback(img) {
    // MediaPipe unavailable / failed to load — keep the original background,
    // just crop to the 4:5 box and grade gently. Never crash.
    var canvas = document.getElementById('out');
    var ctx = canvas.getContext('2d');
    paintBackdrop(ctx);
    var sx = CROP.x * img.naturalWidth, sy = CROP.y * img.naturalHeight;
    var sw = CROP.w * img.naturalWidth, sh = CROP.h * img.naturalHeight;
    ctx.filter = 'saturate(0.90) contrast(1.04) brightness(0.97)';
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, OUT_W, OUT_H);
    ctx.filter = 'none';
    finish(canvas);
  }

  function run() {
    var params = new URLSearchParams(window.location.search);
    var src = params.get('src') || '../assets/img/avatar-source.jpg';
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onerror = function () {
      document.title = 'AVATAR_SOURCE_MISSING';
      window.__AVATAR_READY__ = true;
    };
    img.onload = function () {
      if (typeof SelfieSegmentation === 'undefined') {
        runFallback(img);
        return;
      }
      try {
        var seg = new SelfieSegmentation({
          locateFile: function (file) {
            return 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/' + file;
          }
        });
        seg.setOptions({ modelSelection: 1 });
        seg.onResults(function (results) {
          try {
            var canvas = document.getElementById('out');
            var ctx = canvas.getContext('2d');
            paintBackdrop(ctx);

            // mask -> offscreen canvas, feathered
            var maskCanvas = document.createElement('canvas');
            maskCanvas.width = results.segmentationMask.width;
            maskCanvas.height = results.segmentationMask.height;
            var mctx = maskCanvas.getContext('2d');
            mctx.filter = 'blur(' + FEATHER + 'px)';
            mctx.drawImage(results.segmentationMask, 0, 0);

            var subjectCanvas = document.createElement('canvas');
            subjectCanvas.width = img.naturalWidth;
            subjectCanvas.height = img.naturalHeight;
            var sctx = subjectCanvas.getContext('2d');
            sctx.drawImage(img, 0, 0);
            sctx.globalCompositeOperation = 'destination-in';
            sctx.drawImage(maskCanvas, 0, 0, img.naturalWidth, img.naturalHeight);
            sctx.globalCompositeOperation = 'source-over';

            var sx = CROP.x * img.naturalWidth, sy = CROP.y * img.naturalHeight;
            var sw = CROP.w * img.naturalWidth, sh = CROP.h * img.naturalHeight;

            // ambient occlusion silhouette behind subject
            ctx.save();
            ctx.filter = 'blur(18px)';
            ctx.globalAlpha = SETTLE;
            ctx.drawImage(subjectCanvas, sx, sy, sw, sh, 10, 14, OUT_W, OUT_H);
            ctx.restore();

            // subject, gently graded
            ctx.save();
            ctx.filter = 'saturate(0.90) contrast(1.04) brightness(0.97)';
            ctx.drawImage(subjectCanvas, sx, sy, sw, sh, 0, 0, OUT_W, OUT_H);
            ctx.restore();

            // restrained rim light
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.globalAlpha = RIM;
            var rim = ctx.createLinearGradient(OUT_W, 0, 0, OUT_H);
            rim.addColorStop(0, 'rgba(255,255,255,0.9)');
            rim.addColorStop(0.25, 'rgba(255,255,255,0)');
            ctx.fillStyle = rim;
            ctx.fillRect(0, 0, OUT_W, OUT_H);
            ctx.restore();

            // brand tint, soft-light, subject-only via mask
            ctx.save();
            ctx.globalCompositeOperation = 'destination-in';
            ctx.drawImage(subjectCanvas, sx, sy, sw, sh, 0, 0, OUT_W, OUT_H);
            ctx.restore();

            ctx.save();
            ctx.globalCompositeOperation = 'soft-light';
            ctx.globalAlpha = TINT;
            var tint = ctx.createLinearGradient(0, 0, OUT_W, OUT_H);
            tint.addColorStop(0, '#7c3aed');
            tint.addColorStop(1, '#06b6d4');
            ctx.fillStyle = tint;
            ctx.fillRect(0, 0, OUT_W, OUT_H);
            ctx.restore();

            // graduated desaturation below the collar
            ctx.save();
            ctx.globalCompositeOperation = 'saturation';
            ctx.globalAlpha = MUTE;
            var muteGrad = ctx.createLinearGradient(0, OUT_H * 0.45, 0, OUT_H);
            muteGrad.addColorStop(0, 'rgba(128,128,128,0)');
            muteGrad.addColorStop(1, 'rgba(128,128,128,1)');
            ctx.fillStyle = muteGrad;
            ctx.fillRect(0, 0, OUT_W, OUT_H);
            ctx.restore();

            finish(canvas);
          } catch (e) {
            runFallback(img);
          }
        });
        seg.send({ image: img }).catch(function () { runFallback(img); });
      } catch (e) {
        runFallback(img);
      }
    };
    img.src = src;
  }

  run();
</script>
</body>
</html>
